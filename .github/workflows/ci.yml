# The offline tests, on every push and pull request. No model calls, so no API keys are needed.
# Each action is pinned to an exact commit (the version is in the comment); Dependabot keeps them up to date.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: windows-latest   # the lab is Windows-only (.venv\Scripts, .bat files)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]   # the oldest supported, and the newest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Check for mistakes (ruff)
        if: matrix.python == '3.14'
        run: |
          python -m pip install ruff==0.17.2
          ruff check .

  page:
    name: Web page
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The built page in git matches ui/
        run: |
          npm run build
          $changed = git status --porcelain -- ../harness/web/static
          if ($changed) {
            Write-Output $changed
            Write-Output "::error::The built page is out of date. Run npm run build in ui/ and commit harness/web/static/."
            exit 1
          }
